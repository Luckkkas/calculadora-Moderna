<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DModern calculator | Luckkas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="calculation">0</div>
        <div class="buttons">
            <button id="clear">AC</button>
            <button id="delete">DEL</button>
            <button class="oprBtn">%</button>
            <button class="operator oprBtn">/</button>

            <button class="numBtn">7</button>
            <button class="numBtn">8</button>
            <button class="numBtn">9</button>
            <button class="operator oprBtn">*</button>

            <button class="numBtn">4</button>
            <button class="numBtn">5</button>
            <button class="numBtn">6</button>
            <button class="operator oprBtn">-</button>

            <button class="numBtn">1</button>
            <button class="numBtn">2</button>
            <button class="numBtn">3</button>
            <button class="operator oprBtn">+</button>

            <button class="spanBtn numBtn">0</button>
            <button onclick="addDecimal()">.</button>
            <button id="equalBtn" class="operator">=</button>
        </div>
    </div>

</body>
<script src="script.js"></script>

</html>
